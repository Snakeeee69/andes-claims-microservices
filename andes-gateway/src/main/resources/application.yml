server:
  port: 8080

spring:
  application:
    name: andes-gateway
  cloud:
    compatibility-verifier:
      enabled: false
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "*"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
          routes:
            # 1. Credenciales y Login (ms-auth-usuarios - Puerto 8081)
            - id: ms-auth-route
              uri: lb://ms-auth-usuarios
              predicates:
                - Path=/api/auth/**

            # 2. Usuarios y Perfiles (ms-usuarios - Puerto 8082)
            - id: ms-usuarios-route
              uri: lb://ms-usuarios
              predicates:
                - Path=/api/usuarios/**

            # 3. Siniestros, Catálogo, Asignación, Documentos, Historial, Notificaciones y Liquidación (ms-siniestros - Puerto 8083)
            - id: ms-siniestros-route
              uri: lb://ms-siniestros
              predicates:
                - Path=/api/siniestros/**,/api/areas/**,/api/catalogo/**,/api/requisitos/**,/api/asignaciones/**,/api/evidencias/**,/api/documentos/**,/api/historial/**,/api/notificaciones/**,/api/liquidacion/**,/api/liquidaciones/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://eureka-server:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

jwt:
  secret: AndesBpoClaveSecretaSuperSeguraParaFirmarTokensJWT2026Chile