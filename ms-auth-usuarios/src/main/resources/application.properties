spring.application.name=ms-auth-usuarios
server.port=8081

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/andes_auth_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.web.error.include-message=always
spring.web.error.include-binding-errors=always

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

servicios.usuarios-uri=${MS_USUARIOS_URI:http://localhost:8089}

jwt.secret=AndesBpoClaveSecretaSuperSeguraParaFirmarTokensJWT2026Chile
jwt.expiration-ms=86400000