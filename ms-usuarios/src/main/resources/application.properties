spring.application.name=ms-usuarios
server.port=8089

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/andes_usuarios_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

spring.web.error.include-message=always
spring.web.error.include-binding-errors=always

servicios.auth-uri=${MS_AUTH_URI:http://localhost:8081}